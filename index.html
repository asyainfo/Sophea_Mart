<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Sophea Mart — Online Mini Mart & Grocery Store</title>
    <meta
      name="description"
      content="Shop groceries, drinks, snacks, and daily essentials online at Sophea Mart in Phnom Penh, Cambodia. Fast checkout and rewards!"
    />

    <!-- Mobile Web App Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sophea Mart" />

    <!-- Icons & PWA Manifest -->
    <link rel="icon" type="image/png" href="/Sophea Mart.png" />
    <link rel="apple-touch-icon" href="/Sophea Mart.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preload Navbar Logo for 0ms Header Render -->
    <link rel="preload" as="image" href="/Sophea Mart no1.png" />

    <!-- Telegram / Facebook / Social Share Card (Open Graph) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sophea Mart" />
    <meta property="og:title" content="Sophea Mart — Phnom Penh Online Store" />
    <meta
      property="og:description"
      content="Order groceries, drinks, and daily essentials online at Sophea Mart."
    />
    <meta property="og:url" content="https://sopheamart.store/" />
    <meta
      property="og:image"
      content="https://sopheamart.store/Sophea%20Mart.png"
    />

    <style>
      body {
        margin: 0;
        background-color: #f9fafb;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
